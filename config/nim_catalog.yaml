      endpoint: "http://localhost:8000/v1"
    - name: "llama-3-70b-instruct"
      uri: "ngc://nim/meta/llama3-70b-instruct:latest"
      endpoint: "http://localhost:8001/v1"
    - name: "mistral-large"
      uri: "ngc://nim/mistralai/mistral-large:latest"
