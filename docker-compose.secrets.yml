version: '3.8'

secrets:
  ngc_api_key:
    file: ./secrets/ngc_api_key.txt
  milvus_token:
    file: ./secrets/milvus_token.txt

services:
  nim-llm-reasoning:
    image: nvcr.io/nim/nvidia/nemotron-4-340b-instruct:latest
    container_name: nim-nemotron-340b
    secrets:
      - ngc_api_key
    environment:
      - NGC_API_KEY_FILE=/run/secrets/ngc_api_key
      - CUDA_VISIBLE_DEVICES=0,1,2,3
      - NIM_CACHE_PATH=/opt/nim/.cache
    ports:
      - "8000:8000"
    ipc: host
    volumes:
      - nim-cache:/opt/nim/.cache

  sentinel-core:
    build:
      context: .
      dockerfile: Dockerfile
    secrets:
      - ngc_api_key
      - milvus_token
    environment:
      - NGC_API_KEY_FILE=/run/secrets/ngc_api_key
      - MILVUS_TOKEN_FILE=/run/secrets/milvus_token
      - NIM_LLM_ENDPOINT=http://nim-llm-reasoning:8000/v1
    depends_on:
      - nim-llm-reasoning

volumes:
  nim-cache:
