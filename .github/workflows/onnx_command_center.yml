name: ONNX Model Command Center (GPU / TensorRT)

on:
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Select ONNX Action'
        required: true
        default: 'benchmark'
        type: choice
        options:
          - 'benchmark'
          - 'quantize_int8'
          - 'validate_graph'
      model_path:
        description: 'Path to target .onnx model'
        required: true
        default: 'models/sentinel_core.onnx'
        type: string
      quant_mode:
        description: 'Quantization Type (for quantize_int8 action)'
        required: true
        default: 'dynamic'
        type: choice
        options:
          - 'dynamic'
          - 'static'
      execution_provider:
        description: 'Execution Provider'
        required: true
        default: 'TensorRTExecutionProvider'
        type: choice
        options:
          - 'TensorRTExecutionProvider'
          - 'CUDAExecutionProvider'
          - 'CPUExecutionProvider'

jobs:
  execute-onnx-command-gpu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify GPU Availability
        run: |
          if command -v nvidia-smi &> /dev/null; then
            nvidia-smi
          else
            echo "NVIDIA Driver not found. Falling back to available software runners."
          fi

      - name: Install ONNX Runtime GPU & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install onnx onnxruntime-gpu numpy

      - name: Execute ONNX Pipeline Command
        run: |
          echo "Executing Action: ${{ github.event.inputs.action_type }}"
          echo "Target Model: ${{ github.event.inputs.model_path }}"
          echo "Execution Provider: ${{ github.event.inputs.execution_provider }}"

          python -c "
          import os
          import sys
          import time
          import onnx
          import numpy as np
          import onnxruntime as ort
          from onnxruntime.quantization import (
              quantize_dynamic,
              quantize_static,
              QuantType,
              CalibrationDataReader,
              QuantFormat,
              CalibrationMethod
          )

          action = '${{ github.event.inputs.action_type }}'
          model_path = '${{ github.event.inputs.model_path }}'
          quant_mode = '${{ github.event.inputs.quant_mode }}'
          selected_ep = '${{ github.event.inputs.execution_provider }}'

          print(f'=== Available Execution Providers: {ort.get_available_providers()} ===')

          # Configure Provider Options
          provider_options = []
          if selected_ep == 'TensorRTExecutionProvider':
              provider_options = [{
                  'trt_fp16_enable': True,
                  'trt_engine_cache_enable': True,
                  'trt_engine_cache_path': './trt_cache'
              }]
          elif selected_ep == 'CUDAExecutionProvider':
              provider_options = [{
                  'device_id': 0,
                  'arena_extend_strategy': 'kNextPowerOfTwo',
                  'cudnn_conv_algo_search': 'EXHAUSTIVE',
                  'do_copy_in_default_stream': True
              }]

          providers = [(selected_ep, provider_options[0])] if provider_options else [selected_ep]

          if action == 'validate_graph':
              if not os.path.exists(model_path):
                  print(f'[ERROR] Model path does not exist: {model_path}')
                  sys.exit(1)
              model = onnx.load(model_path)
              onnx.checker.check_model(model)
              print('[SUCCESS] ONNX Graph structure is valid.')

          elif action == 'quantize_int8':
              if not os.path.exists(model_path):
                  print(f'[ERROR] Model path does not exist: {model_path}')
                  sys.exit(1)

              output_model_path = model_path.replace('.onnx', f'_{quant_mode}_int8.onnx')
              print(f'[QUANTIZATION START] Mode: {quant_mode.upper()}')
              print(f'Input Model: {model_path}')
              print(f'Output Model: {output_model_path}')

              if quant_mode == 'dynamic':
                  quantize_dynamic(
                      model_input=model_path,
                      model_output=output_model_path,
                      weight_type=QuantType.QUInt8,
                      optimize_model=True
                  )
                  print('[QUANTIZATION COMPLETE] Dynamic INT8 model generated.')

              elif quant_mode == 'static':
                  class SyntheticCalibrationDataReader(CalibrationDataReader):
                      def __init__(self, model_file, num_samples=20):
                          session = ort.InferenceSession(model_file, providers=['CPUExecutionProvider'])
                          self.enum_data = []
                          for _ in range(num_samples):
                              inputs = {}
                              for inp in session.get_inputs():
                                  shape = [dim if isinstance(dim, int) and dim > 0 else 1 for dim in inp.shape]
                                  inputs[inp.name] = np.random.randn(*shape).astype(np.float32)
                              self.enum_data.append(inputs)
                          self.enum_data = iter(self.enum_data)

                      def get_next(self):
                          return next(self.enum_data, None)

                  dr = SyntheticCalibrationDataReader(model_path)
                  quantize_static(
                      model_input=model_path,
                      model_output=output_model_path,
                      calibration_data_reader=dr,
                      quant_format=QuantFormat.QDQ,
                      activation_type=QuantType.QInt8,
                      weight_type=QuantType.QInt8,
                      calibrate_method=CalibrationMethod.MinMax
                  )
                  print('[QUANTIZATION COMPLETE] Static QDQ INT8 model generated.')

              orig_size = os.path.getsize(model_path) / (1024 * 1024)
              quant_size = os.path.getsize(output_model_path) / (1024 * 1024)
              reduction = (1 - (quant_size / orig_size)) * 100

              print('=== SIZE METRICS ===')
              print(f'Original Model: {orig_size:.2f} MB')
              print(f'Quantized Model: {quant_size:.2f} MB')
              print(f'Compression Rate: {reduction:.2f}% size reduction')

          elif action == 'benchmark':
              if not os.path.exists(model_path):
                  print(f'[ERROR] Model path does not exist: {model_path}')
                  sys.exit(1)

              session = ort.InferenceSession(model_path, providers=providers)
              print(f'[ACTIVE PROVIDER]: {session.get_providers()}')

              inputs = {}
              for inp in session.get_inputs():
                  shape = [dim if isinstance(dim, int) and dim > 0 else 1 for dim in inp.shape]
                  inputs[inp.name] = np.random.randn(*shape).astype(np.float32)

              print('[WARMUP] Compiling Execution Engine / Warming CUDA context...')
              for _ in range(10):
                  session.run(None, inputs)

              iterations = 100
              start = time.perf_counter()
              for _ in range(iterations):
                  session.run(None, inputs)
              end = time.perf_counter()

              avg_latency = ((end - start) / iterations) * 1000
              print('[BENCHMARK COMPLETE]')
              print(f'Total Time for {iterations} runs: {(end - start):.4f}s')
              print(f'Average Inference Latency: {avg_latency:.2f} ms')
          "

      - name: Upload Quantized Artifact
        if: github.event.inputs.action_type == 'quantize_int8'
        uses: actions/upload-artifact@v4
        with:
          name: onnx-quantized-model
          path: models/*_int8.onnx
