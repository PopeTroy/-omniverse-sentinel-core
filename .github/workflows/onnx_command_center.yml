name: ONNX Model Command Center (PyTorch / TF / GPU)

on:
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Select ONNX Action'
        required: true
        default: 'benchmark'
        type: choice
        options:
          - 'benchmark'
          - 'quantize_int8'
          - 'validate_graph'
      model_source:
        description: 'Model Export Framework Source / Architecture'
        required: true
        default: 'advanced_ml'
        type: choice
        options:
          - 'pid_controller'
          - 'advanced_ml'
          - 'dip_engine'
          - 'pytorch'
          - 'tensorflow'
          - 'synthetic'
      model_path:
        description: 'Path to target .onnx model'
        required: true
        default: 'models/sentinel_core.onnx'
        type: string
      quant_mode:
        description: 'Quantization Type'
        required: true
        default: 'dynamic'
        type: choice
        options:
          - 'dynamic'
          - 'static'
      execution_provider:
        description: 'Execution Provider'
        required: true
        default: 'TensorRTExecutionProvider'
        type: choice
        options:
          - 'TensorRTExecutionProvider'
          - 'CUDAExecutionProvider'
          - 'CPUExecutionProvider'

jobs:
  execute-onnx-command:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install onnx onnxscript onnxruntime-gpu numpy nvidia-cublas-cu12 nvidia-cuda-runtime-cu12 tensorrt torch tensorflow tf2onnx

      - name: Configure CUDA / TensorRT Dynamic Library Paths
        run: |
          SITE_PACKAGES=$(python -c "import site; print(site.getsitepackages()[0])")
          NV_PATHS=$(find "$SITE_PACKAGES/nvidia" -type d -name "lib" 2>/devnull | tr '\n' ':')
          echo "LD_LIBRARY_PATH=${NV_PATHS}${LD_LIBRARY_PATH}" >> $GITHUB_ENV
          echo "[INFO] Appended NVIDIA Shared Libraries to LD_LIBRARY_PATH"

      - name: Export & Process ONNX Model Pipeline
        run: |
          echo "Executing Action: ${{ github.event.inputs.action_type }}"
          echo "Model Source: ${{ github.event.inputs.model_source }}"
          echo "Target Model: ${{ github.event.inputs.model_path }}"
          echo "Execution Provider: ${{ github.event.inputs.execution_provider }}"

          python -c "
          import os
          import sys
          import time
          import numpy as np
          import onnx
          import onnxruntime as ort

          action = '${{ github.event.inputs.action_type }}'
          source = '${{ github.event.inputs.model_source }}'
          model_path = '${{ github.event.inputs.model_path }}'
          quant_mode = '${{ github.event.inputs.quant_mode }}'
          selected_ep = '${{ github.event.inputs.execution_provider }}'

          os.makedirs(os.path.dirname(model_path) or '.', exist_ok=True)

          if not os.path.exists(model_path):
              print(f'[INFO] Exporting model graph using framework source/architecture: {source}')
              import torch
              import torch.nn as nn

              if source == 'pid_controller':
                  class PIDControllerModel(nn.Module):
                      def __init__(self, kp=1.2, ki=0.5, kd=0.1):
                          super().__init__()
                          self.gains = nn.Parameter(torch.tensor([kp, ki, kd], dtype=torch.float32), requires_grad=False)
                          self.fc = nn.Linear(3, 16)
                          self.out = nn.Linear(16, 1)

                      def forward(self, x):
                          # x shape: [batch, 3] -> (error, integral, derivative)
                          pid_calc = x * self.gains
                          feat = torch.relu(self.fc(pid_calc))
                          return self.out(feat)

                  m = PIDControllerModel()
                  m.eval()
                  dummy_input = torch.randn(1, 3, dtype=torch.float32)
                  torch.onnx.export(
                      m, dummy_input, model_path,
                      input_names=['pid_inputs'], output_names=['control_signal'],
                      opset_version=17, dynamo=False,
                      dynamic_axes={'pid_inputs': {0: 'batch_size'}, 'control_signal': {0: 'batch_size'}}
                  )
                  print('[SUCCESS] PID Controller model exported to ONNX successfully.')

              elif source == 'advanced_ml':
                  class TransformerBlock(nn.Module):
                      def __init__(self, d_model=64, nhead=4):
                          super().__init__()
                          self.attn = nn.MultiheadAttention(embed_dim=d_model, num_heads=nhead, batch_first=True)
                          self.norm1 = nn.LayerNorm(d_model)
                          self.ffn = nn.Sequential(
                              nn.Linear(d_model, d_model * 2),
                              nn.ReLU(),
                              nn.Linear(d_model * 2, d_model)
                          )
                          self.norm2 = nn.LayerNorm(d_model)

                      def forward(self, x):
                          attn_out, _ = self.attn(x, x, x)
                          x = self.norm1(x + attn_out)
                          ffn_out = self.ffn(x)
                          return self.norm2(x + ffn_out)

                  m = TransformerBlock()
                  m.eval()
                  dummy_input = torch.randn(1, 16, 64, dtype=torch.float32)
                  torch.onnx.export(
                      m, dummy_input, model_path,
                      input_names=['sequence_embedding'], output_names=['context_vector'],
                      opset_version=17, dynamo=False,
                      dynamic_axes={'sequence_embedding': {0: 'batch_size'}, 'context_vector': {0: 'batch_size'}}
                  )
                  print('[SUCCESS] Advanced ML (Transformer Multi-Head Attention) exported to ONNX successfully.')

              elif source == 'dip_engine':
                  class DIPFilterEngine(nn.Module):
                      def __init__(self):
                          super().__init__()
                          self.conv1 = nn.Conv2d(in_channels=3, out_channels=16, kernel_size=3, padding=1)
                          self.relu = nn.ReLU()
                          self.pool = nn.MaxPool2d(kernel_size=2, stride=2)
                          self.conv2 = nn.Conv2d(in_channels=16, out_channels=32, kernel_size=3, padding=1)
                          self.adapt_pool = nn.AdaptiveAvgPool2d((8, 8))

                      def forward(self, x):
                          x = self.pool(self.relu(self.conv1(x)))
                          x = self.adapt_pool(self.relu(self.conv2(x)))
                          return x

                  m = DIPFilterEngine()
                  m.eval()
                  dummy_input = torch.randn(1, 3, 64, 64, dtype=torch.float32)
                  torch.onnx.export(
                      m, dummy_input, model_path,
                      input_names=['image_tensor'], output_names=['feature_map'],
                      opset_version=17, dynamo=False,
                      dynamic_axes={'image_tensor': {0: 'batch_size'}, 'feature_map': {0: 'batch_size'}}
                  )
                  print('[SUCCESS] Digital Image Processing (DIP) Engine exported to ONNX successfully.')

              elif source == 'pytorch':
                  class PyTorchModel(nn.Module):
                      def __init__(self):
                          super().__init__()
                          self.net = nn.Sequential(nn.Linear(128, 256), nn.ReLU(), nn.Linear(256, 128))
                      def forward(self, x):
                          return self.net(x)

                  m = PyTorchModel()
                  m.eval()
                  dummy_input = torch.randn(1, 128, dtype=torch.float32)
                  torch.onnx.export(
                      m, dummy_input, model_path,
                      input_names=['input_ids'], output_names=['output'],
                      opset_version=17, dynamo=False,
                      dynamic_axes={'input_ids': {0: 'batch_size'}, 'output': {0: 'batch_size'}}
                  )
                  print('[SUCCESS] Standard PyTorch model exported to ONNX successfully.')

              elif source == 'tensorflow':
                  import tensorflow as tf
                  import tf2onnx
                  m = tf.keras.Sequential([
                      tf.keras.layers.InputLayer(input_shape=(128,), name='input_ids'),
                      tf.keras.layers.Dense(256, activation='relu'),
                      tf.keras.layers.Dense(128, name='output')
                  ])
                  spec = [tf.TensorSpec([None, 128], tf.float32, name='input_ids')]
                  onnx_m, _ = tf2onnx.convert.from_keras(m, input_signature=spec, opset=17)
                  with open(model_path, 'wb') as f:
                      f.write(onnx_m.SerializeToString())
                  print('[SUCCESS] TensorFlow model exported to ONNX successfully.')

              else:
                  from onnx import helper, TensorProto
                  input_tensor = helper.make_tensor_value_info('input_ids', TensorProto.FLOAT, [1, 128])
                  output_tensor = helper.make_tensor_value_info('output', TensorProto.FLOAT, [1, 128])
                  identity_node = helper.make_node('Identity', ['input_ids'], ['output'])
                  graph = helper.make_graph([identity_node], 'synthetic_sentinel', [input_tensor], [output_tensor])
                  onnx.save(helper.make_model(graph, opset_imports=[helper.make_opsetid('', 19)]), model_path)
                  print('[SUCCESS] Synthetic ONNX graph constructed successfully.')

          available_eps = ort.get_available_providers()
          ep_map = {p.lower(): p for p in available_eps}
          active_ep = ep_map.get(selected_ep.lower(), 'CPUExecutionProvider')
          print(f'=== Active Execution Provider: {active_ep} ===')

          providers = [active_ep]

          if action == 'validate_graph':
              model = onnx.load(model_path)
              onnx.checker.check_model(model)
              print('[SUCCESS] ONNX Graph structure is valid.')

          elif action == 'quantize_int8':
              from onnxruntime.quantization import quantize_dynamic, QuantType
              output_model_path = model_path.replace('.onnx', f'_{quant_mode}_int8.onnx')
              print(f'[QUANTIZING] Dynamic INT8 pass on {model_path} -> {output_model_path}')
              quantize_dynamic(
                  model_input=model_path,
                  model_output=output_model_path,
                  weight_type=QuantType.QUInt8
              )
              print('[QUANTIZATION COMPLETE]')

          elif action == 'benchmark':
              try:
                  session = ort.InferenceSession(model_path, providers=providers)
              except Exception as e:
                  print(f'[WARNING] Failed to initialize provider {active_ep}: {e}')
                  session = ort.InferenceSession(model_path, providers=['CPUExecutionProvider'])

              print(f'[ACTIVE SESSION PROVIDERS]: {session.get_providers()}')

              # Generate shape-matched dummy input dynamically based on graph requirements
              inputs = {}
              for inp in session.get_inputs():
                  shape = [s if isinstance(s, int) and s > 0 else 1 for s in inp.shape]
                  inputs[inp.name] = np.random.randn(*shape).astype(np.float32)

              for _ in range(5):
                  session.run(None, inputs)

              iterations = 100
              start = time.perf_counter()
              for _ in range(iterations):
                  session.run(None, inputs)
              end = time.perf_counter()

              avg_ms = ((end - start) / iterations) * 1000
              print(f'[BENCHMARK COMPLETE] Average Latency: {avg_ms:.3f} ms over {iterations} runs')
          "

      - name: Upload Quantized Artifact
        if: github.event.inputs.action_type == 'quantize_int8'
        uses: actions/upload-artifact@v4
        with:
          name: onnx-quantized-model
          path: "models/*_int8.onnx"
