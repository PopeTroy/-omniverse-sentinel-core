Name: ONNX Model Command Center (PyTorch / TF / GPU)

on:
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Select ONNX Action'
        required: true
        default: 'benchmark'
        type: choice
        options:
          - 'benchmark'
          - 'quantize_int8'
          - 'validate_graph'
      model_source:
        description: 'Model Export Framework Source'
        required: true
        default: 'pytorch'
        type: choice
        options:
          - 'pytorch'
          - 'tensorflow'
          - 'synthetic'
      model_path:
        description: 'Path to target .onnx model'
        required: true
        default: 'models/sentinel_core.onnx'
        type: string
      quant_mode:
        description: 'Quantization Type'
        required: true
        default: 'dynamic'
        type: choice
        options:
          - 'dynamic'
          - 'static'
      execution_provider:
        description: 'Execution Provider'
        required: true
        default: 'TensorRTExecutionProvider'
        type: choice
        options:
          - 'TensorRTExecutionProvider'
          - 'CUDAExecutionProvider'
          - 'CPUExecutionProvider'

jobs:
  execute-onnx-command:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install onnx onnxscript onnxruntime-gpu numpy nvidia-cublas-cu12 nvidia-cuda-runtime-cu12 tensorrt torch tensorflow tf2onnx

      - name: Configure CUDA / TensorRT Dynamic Library Paths
        run: |
          SITE_PACKAGES=$(python -c "import site; print(site.getsitepackages()[0])")
          NV_PATHS=$(find "$SITE_PACKAGES/nvidia" -type d -name "lib" 2>/devnull | tr '\n' ':')
          echo "LD_LIBRARY_PATH=${NV_PATHS}${LD_LIBRARY_PATH}" >> $GITHUB_ENV
          echo "[INFO] Appended NVIDIA Shared Libraries to LD_LIBRARY_PATH"

      - name: Export & Process ONNX Model Pipeline
        run: |
          echo "Executing Action: ${{ github.event.inputs.action_type }}"
          echo "Model Source: ${{ github.event.inputs.model_source }}"
          echo "Target Model: ${{ github.event.inputs.model_path }}"
          echo "Execution Provider: ${{ github.event.inputs.execution_provider }}"

          python -c "
          import os
          import sys
          import time
          import numpy as np
          import onnx
          import onnxruntime as ort

          action = '${{ github.event.inputs.action_type }}'
          source = '${{ github.event.inputs.model_source }}'
          model_path = '${{ github.event.inputs.model_path }}'
          quant_mode = '${{ github.event.inputs.quant_mode }}'
          selected_ep = '${{ github.event.inputs.execution_provider }}'

          os.makedirs(os.path.dirname(model_path) or '.', exist_ok=True)

          if not os.path.exists(model_path):
              print(f'[INFO] Exporting model graph using framework source: {source}')
              if source == 'pytorch':
                  import torch
                  import torch.nn as nn
                  class PyTorchModel(nn.Module):
                      def __init__(self):
                          super().__init__()
                          self.net = nn.Sequential(
                              nn.Linear(128, 256),
                              nn.ReLU(),
                              nn.Linear(256, 128)
                          )
                      def forward(self, x):
                          return self.net(x)
                  
                  m = PyTorchModel()
                  m.eval()
                  dummy_input = torch.randn(1, 128, dtype=torch.float32)
                  
                  torch.onnx.export(
                      m, 
                      dummy_input, 
                      model_path, 
                      input_names=['input_ids'], 
                      output_names=['output'], 
                      opset_version=18,
                      dynamic_axes={
                          'input_ids': {0: 'batch_size'},
                          'output': {0: 'batch_size'}
                      }
                  )
                  print('[SUCCESS] PyTorch model exported to ONNX successfully.')

              elif source == 'tensorflow':
                  import tensorflow as tf
                  import tf2onnx
                  m = tf.keras.Sequential([
                      tf.keras.layers.InputLayer(input_shape=(128,), name='input_ids'),
                      tf.keras.layers.Dense(256, activation='relu'),
                      tf.keras.layers.Dense(128, name='output')
                  ])
                  spec = [tf.TensorSpec([None, 128], tf.float32, name='input_ids')]
                  onnx_m, _ = tf2onnx.convert.from_keras(m, input_signature=spec, opset=18)
                  with open(model_path, 'wb') as f:
                      f.write(onnx_m.SerializeToString())
                  print('[SUCCESS] TensorFlow model exported to ONNX successfully.')

              else:
                  from onnx import helper, TensorProto
                  input_tensor = helper.make_tensor_value_info('input_ids', TensorProto.FLOAT, [1, 128])
                  output_tensor = helper.make_tensor_value_info('output', TensorProto.FLOAT, [1, 128])
                  identity_node = helper.make_node('Identity', ['input_ids'], ['output'])
                  graph = helper.make_graph([identity_node], 'synthetic_sentinel', [input_tensor], [output_tensor])
                  onnx.save(helper.make_model(graph, opset_imports=[helper.make_opsetid('', 19)]), model_path)
                  print('[SUCCESS] Synthetic ONNX graph constructed successfully.')

          # Ensure ONNX shape inference is clean before quantization
          model = onnx.load(model_path)
          inferred_model = onnx.shape_inference.infer_shapes(model)
          onnx.save(inferred_model, model_path)

          available_eps = ort.get_available_providers()
          ep_map = {p.lower(): p for p in available_eps}
          active_ep = ep_map.get(selected_ep.lower(), 'CPUExecutionProvider')
          print(f'=== Active Execution Provider: {active_ep} ===')

          providers = [active_ep]

          if action == 'validate_graph':
              onnx.checker.check_model(inferred_model)
              print('[SUCCESS] ONNX Graph structure is valid.')

          elif action == 'quantize_int8':
              from onnxruntime.quantization import quantize_dynamic, QuantType
              output_model_path = model_path.replace('.onnx', f'_{quant_mode}_int8.onnx')
              print(f'[QUANTIZING] Dynamic INT8 pass on {model_path} -> {output_model_path}')
              quantize_dynamic(
                  model_input=model_path,
                  model_output=output_model_path,
                  weight_type=QuantType.QUInt8
              )
              print('[QUANTIZATION COMPLETE]')

          elif action == 'benchmark':
              try:
                  session = ort.InferenceSession(model_path, providers=providers)
              except Exception as e:
                  print(f'[WARNING] Failed to initialize provider {active_ep}: {e}')
                  session = ort.InferenceSession(model_path, providers=['CPUExecutionProvider'])

              print(f'[ACTIVE SESSION PROVIDERS]: {session.get_providers()}')

              inputs = {inp.name: np.random.randn(1, 128).astype(np.float32) for inp in session.get_inputs()}

              for _ in range(5):
                  session.run(None, inputs)

              iterations = 100
              start = time.perf_counter()
              for _ in range(iterations):
                  session.run(None, inputs)
              end = time.perf_counter()

              avg_ms = ((end - start) / iterations) * 1000
              print(f'[BENCHMARK COMPLETE] Average Latency: {avg_ms:.3f} ms over {iterations} runs')
          "

      - name: Upload Quantized Artifact
        if: github.event.inputs.action_type == 'quantize_int8'
        uses: actions/upload-artifact@v4
        with:
          name: onnx-quantized-model
          path: "models/*_int8.onnx"
