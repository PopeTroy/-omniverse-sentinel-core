name: ONNX Model Command Center

on:
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Select ONNX Action'
        required: true
        default: 'benchmark'
        type: choice
        options:
          - 'benchmark'
          - 'quantize_int8'
          - 'validate_graph'
      model_path:
        description: 'Path to target .onnx model'
        required: true
        default: 'models/sentinel_core.onnx'
        type: string
      precision_mode:
        description: 'Execution Precision'
        required: true
        default: 'FP16'
        type: choice
        options:
          - 'FP16'
          - 'FP32'
          - 'INT8'

jobs:
  execute-onnx-command:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install ONNX Runtime & Tools
        run: |
          python -m pip install --upgrade pip
          pip install onnx onnxruntime numpy

      - name: Execute ONNX Pipeline Command
        run: |
          echo "Executing Action: ${{ github.event.inputs.action_type }}"
          echo "Target Model: ${{ github.event.inputs.model_path }}"
          echo "Precision Mode: ${{ github.event.inputs.precision_mode }}"
          
          python -c "
          import onnx
          import onnxruntime as ort
          import numpy as np
          import sys

          action = '${{ github.event.inputs.action_type }}'
          model_path = '${{ github.event.inputs.model_path }}'

          print(f'=== ONNX Runtime Version: {ort.__version__} ===')

          if action == 'validate_graph':
              model = onnx.load(model_path)
              onnx.checker.check_model(model)
              print('[SUCCESS] ONNX Graph structure is valid.')

          elif action == 'benchmark':
              session = ort.InferenceSession(model_path, providers=['CPUExecutionProvider'])
              inputs = {inp.name: np.random.randn(*[dim if isinstance(dim, int) else 1 for dim in inp.shape]).astype(np.float32) for inp in session.get_inputs()}
              
              import time
              start = time.time()
              for _ in range(50):
                  session.run(None, inputs)
              end = time.time()
              print(f'[BENCHMARK COMPLETE] 50 Inferences completed in {(end - start):.4f} seconds.')
          "

      - name: Upload Processed Artifacts
        if: github.event.inputs.action_type == 'quantize_int8'
        uses: actions/upload-artifact@v4
        with:
          name: onnx-quantized-model
          path: models/quantized_*.onnx
